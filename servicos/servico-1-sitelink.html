  <header class="sitelink-form-heading">
    <p class="eyebrow">Criação de sites profissionais</p>
    <h1>Vamos criar o site do seu negócio?</h1>
    <p>Preencha o formulário. Você poderá revisar as informações e enviar sua solicitação pelo WhatsApp.</p>
  </header>

  <section class="sitelink-form-card" aria-label="Solicitação de orçamento para criação de sites">
    <form id="contact-form">
      <div class="form-group">
        <label for="name">Nome completo *</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp com DDD *</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(83) 99999-9999" required>
      </div>

      <div class="form-group">
        <label for="business">Nome da empresa ou negócio *</label>
        <input id="business" name="business" type="text" autocomplete="organization" required>
      </div>

      <div class="form-group">
        <label for="service">Serviço de interesse *</label>
        <select id="service" name="service" required>
          <option value="Criação de sites profissionais" selected>Criação de sites profissionais</option>
          <option value="Landing page">Landing page</option>
          <option value="Site institucional">Site institucional</option>
          <option value="Página para Google Ads">Página para Google Ads</option>
          <option value="Outro serviço">Outro serviço</option>
        </select>
      </div>

      <div class="form-group">
        <label for="details">Conte um pouco sobre o que precisa (opcional)</label>
        <textarea id="details" name="details" rows="4" placeholder="Descreva brevemente seu projeto."></textarea>
      </div>

      <p id="form-feedback" role="status" aria-live="polite"></p>

      <button class="button button-primary" type="submit" data-cta="solicitar_orcamento_sites">
        Solicitar orçamento pelo WhatsApp ↗
      </button>

      <p class="form-note">Seus dados serão usados para responder à sua solicitação.</p>
    </form>
  </section>
</div>
